# Single-server deployment: Caddy (HTTPS) -> Next.js (web) -> FastAPI (api) -> Postgres (db).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ct
      POSTGRES_DB: ct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    depends_on: [db]
  web:
    build:
      context: ../frontend
    restart: unless-stopped
    environment:
      CT_API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on: [api]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CT_DOMAIN: ${CT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
volumes:
  pgdata:
  caddy_data:
